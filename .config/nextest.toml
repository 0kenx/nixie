# nextest configuration for the nixie workspace.
#
# `nixie-cli` ships a handful of tests that spawn the real `nixie` binary as a
# subprocess and race it against a wall-clock deadline (the `--timeout`
# regression tests in `tests/audit_cli_p2.rs` and
# `tests/audit_sweep_frontends.rs`) or measure its wall-clock duration
# (`tests/benchmark.rs`'s `bench_*` tests). Under nextest's default
# concurrency, many of these can run at once, each spawning its own
# CPU-bound child solver; the resulting CPU oversubscription was observed to
# turn a 2s `--timeout` into tens to hundreds of seconds of real wall time,
# which starves the very timing margins these tests rely on and makes them
# flaky. `supervise_timeout` (nixie-cli/src/main.rs) already mitigates the
# *supervisor* side of this (a dedicated, non-solving watchdog process), but
# it cannot help once the machine itself is oversubscribed by many parallel
# test processes each spawning their own solver child.
#
# Force this subset into a single-threaded serial group so at most one such
# subprocess-racing/timing test runs at a time, regardless of the overall
# `--test-threads` nextest is running with.
[test-groups]
nixie-cli-subprocess = { max-threads = 1 }

# A runaway allocation previously ran until the kernel OOM killer intervened;
# nextest's default reports a test as SLOW at 60s but never terminates it.
# Cap it so a stuck test is killed instead of consuming memory indefinitely.
# (Ported from upstream v0.3.3.)
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Tighter budget for CI: fail fast on a stuck test instead of burning the job's wall clock.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2 }

# The cxs-bp non-convex-gap canary is a known-slow DEBUG-profile soundness
# guard (release: ~25 s; debug under load: several minutes). It is not a
# runaway allocation - the thing terminate-after exists to kill - so give it
# a wider budget rather than letting the 3x60s default terminate it.
#
# Since 2026-09-04 the test carries #[ignore = ...] and is therefore OUT of
# the default `cargo nextest run --workspace --all-features` pass: its ~330 s
# debug runtime exceeds the verification gate harness's command budget, and
# one slow test made the whole suite report failure (SIGTERM at ~291 s) even
# though the assertion passes. It remains runnable (and must be run before
# any landing that touches arrangement/congruence/model checking) via:
#
#   cargo nextest run -p nixie-solver --run-ignored only \
#     -E 'test(pete_cxs_bp_is_unsat_on_every_trajectory)'
#
# This override still applies to that explicit run (profiles are shared),
# which is why it is kept.
[[profile.default.overrides]]
filter = 'test(pete_cxs_bp_is_unsat_on_every_trajectory)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'package(nixie-cli) and (test(timeout) or test(bench))'
test-group = 'nixie-cli-subprocess'
threads-required = 1

# The heaviest 600-rerun convergence pin measures trajectory, not code
# cost: debug-profile single-threaded it runs ~95-165s depending on the
# machine (see docs/studies/2026-09-14-uflra-handoff-executed.md for the
# cost decomposition of the MBQI emission-collapse unit that sits on it,
# and docs/studies/2026-09-12-*.md for its history). Under the full
# suite's parallel load its wall time inflates past the default 3x60s,
# which terminated an otherwise-passing test. Widen, following the
# pete_cxs_bp precedent above.
[[profile.default.overrides]]
filter = 'test(re_running_the_search_on_an_unchanged_goal_converges)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The set19 family convergence pin: the completed structure must grow the
# row closure (fresh-row mints) and re-normalize the entry tables before
# every constructor axiom certifies - ~120 s release standalone, ~180 s
# debug under load (it is the one goal in the family z3 4.16.0 cannot
# decide at all). Widen the budget rather than terminating a passing
# test, following the pete_cxs_bp precedent above.
[[profile.default.overrides]]
filter = 'test(set19_family_answers_sat)'
slow-timeout = { period = "60s", terminate-after = 7 }

# The traced/untraced identity pin at its largest kept shape (12x12) runs
# ~230 s in debug since the unsound Gebauer-Moller second criterion was
# disabled (2026-09-18, see nixie-math/tests/ff_gb_seed_dedup_regression.rs
# for the missed-refutation class that forced it). The invariant is
# trajectory identity, not capacity; widen the budget rather than
# terminating a passing test, following the pete_cxs_bp precedent above.
# (The 17x20 shape is trimmed from the test itself: ~245 s+ and the
# smaller shapes cover the invariant.)
[[profile.default.overrides]]
filter = 'test(untraced_and_traced_bases_are_identical)'
slow-timeout = { period = "60s", terminate-after = 10 }
