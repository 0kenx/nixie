[workspace]
resolver = "2"
members = [
    "nixie",
    "nixie-core",
    "nixie-time",
    "nixie-math",
    "nixie-sat",
    "nixie-nlsat",
    "nixie-theories",
    "nixie-solver",
    "nixie-opt",
    "nixie-spacer",
    "nixie-proof",
    "nixie-wasm",
    "nixie-cli",
    "nixie-smtcomp",
    "nixie-ml",
    "bench/regression",
    "bench/profile",
]

default-members = [
    "nixie",
    "nixie-core",
    "nixie-time",
    "nixie-math",
    "nixie-sat",
    "nixie-nlsat",
    "nixie-theories",
    "nixie-solver",
    "nixie-opt",
    "nixie-spacer",
    "nixie-proof",
    "nixie-wasm",
    "nixie-cli",
    "nixie-smtcomp",
    "nixie-ml",
    "bench/regression",
    "bench/profile",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
# Edition 2024 itself only requires rustc 1.85, but the workspace makes
# pervasive use of let-chains (`if ... && let Some(x) = ... { }`, ~350
# occurrences across 156 files as of this release) in production code (e.g.
# `nixie-sat/src/solver/conflict.rs`, `nixie-theories/src/euf/solver.rs`), which
# were only stabilized in 1.88. Set as a conservative, evidence-based floor;
# lower it only after removing/rewriting every let-chain use, and raise it if
# a future feature demands a newer compiler.
rust-version = "1.88"
authors = ["COOLJAPAN OU (Team KitaSan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiz"
description = "Next-Generation SMT Solver in Pure Rust"
keywords = ["smt", "solver", "sat", "verification", "logic"]
categories = ["algorithms", "science", "mathematics"]

[workspace.lints.rust]
unused_variables = "allow"
dead_code = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_if = "allow"

[workspace.dependencies]
# Drop-in global allocator – nixie's CDCL(T) loop is allocation-heavy
# (per-check Vec/SmallVec, conflict cores, clause learning, hashmap rehash);
# mimalloc cuts a large fraction of that overhead vs the system allocator.
mimalloc = { version = "0.1", default-features = false }
# Meta crate
nixie = { version = "0.3.2", path = "nixie" }

# Core crates (default-features = false so downstream can control std)
nixie-core = { version = "0.3.2", path = "nixie-core", default-features = false }
# Wasm-safe std::time drop-ins: the single place any Nixie crate reads a
# clock (see nixie-time/src/lib.rs). Depends on nothing, sits below nixie-math.
nixie-time = { version = "0.3.2", path = "nixie-time", default-features = false }
nixie-math = { version = "0.3.2", path = "nixie-math", default-features = false }
nixie-sat = { version = "0.3.2", path = "nixie-sat", default-features = false }
nixie-nlsat = { version = "0.3.2", path = "nixie-nlsat" }
nixie-theories = { version = "0.3.2", path = "nixie-theories", default-features = false }
nixie-solver = { version = "0.3.2", path = "nixie-solver", default-features = false }
nixie-opt = { version = "0.3.2", path = "nixie-opt" }
nixie-spacer = { version = "0.3.2", path = "nixie-spacer" }
nixie-proof = { version = "0.3.2", path = "nixie-proof" }
nixie-smtcomp = { version = "0.3.2", path = "nixie-smtcomp" }
nixie-ml = { version = "0.3.2", path = "nixie-ml" }

# Memory & Interning
bumpalo = "3.20"
indexmap = { version = "2.14", default-features = false }
lasso = "0.7"

# Parsing
winnow = "1.0"
rhai = "1.25"

# SIMD
wide = "1.5"

# Synchronization
parking_lot = "0.12"

# E-graph / Rewriting
egg = "0.11"

# Parallelism
rayon = "1.12"
num_cpus = "1.17"

# Logging & Tracing
tracing = { version = "0.1", default-features = false }
tracing-subscriber = "0.3"

# Error handling
thiserror = { version = "2.0", default-features = false }
anyhow = "1.0"

# CLI
clap = { version = "4.6", features = ["derive", "cargo"] }
clap_complete = "4.6"
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
owo-colors = { version = "4.3", features = ["supports-colors"] }
indicatif = "0.18"
walkdir = "2.5"
globset = "0.4"
notify = "8.2"
sysinfo = "0.39"
dirs = "6.0"
tower-lsp = "0.20"
tokio = "1.52"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"

# Compression (OxiARC - Pure Rust)
oxiarc-deflate = "0.4.0"
oxiarc-brotli = "0.4.0"

# PDF (Pure Rust)
pdf-writer = "0.15"

# Testing
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"

# Utilities
smallvec = { version = "1.15", features = ["serde", "union"] }
rustc-hash = { version = "2.1", default-features = false }
hashbrown = "0.17"
lru = "0.18"
num-rational = { version = "0.4", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
libm = "0.2"
portable-atomic = { version = "1.13", default-features = false, features = ["critical-section"] }
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"] }
rand = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

[profile.perf]
inherits = "release"
debug = true
# `release` strips symbols, which defeats a profiling profile; keep them.
strip = "none"

[profile.dev]
opt-level = 1
