[package]
name = "bench-regression"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Performance regression testing for Nixie SMT solver"

[[bin]]
name = "regression"
path = "src/main.rs"

[dependencies]
# Nixie crates
nixie-core = { workspace = true, features = ["std"] }
nixie-sat = { workspace = true, features = ["std"] }
nixie-solver = { workspace = true, features = ["std"] }
nixie-theories = { workspace = true, features = ["std"] }
nixie-opt.workspace = true
nixie-smtcomp.workspace = true

# Benchmarking
criterion.workspace = true

# Utilities
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
num-bigint.workspace = true
tempfile.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "nixie_benchmarks"
harness = false
path = "benches/nixie_benchmarks.rs"

[lints.rust]
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
