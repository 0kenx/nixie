[package]
name = "nixie-proof"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Proof generation and checking for Nixie SMT solver"
keywords = ["smt", "proof", "drat", "alethe", "verification"]
categories = ["algorithms", "development-tools::testing"]

[dependencies]
nixie-core = { workspace = true, features = ["std"] }
# The single place this crate reads a clock (wasm-safe; see nixie-time).
nixie-time = { workspace = true, features = ["std"] }
smallvec.workspace = true
rustc-hash = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
bumpalo = { workspace = true, optional = true }
regex = "1.12"
num-rational = { workspace = true, features = ["std"] }
num-bigint = { workspace = true, features = ["std"] }
num-traits = { workspace = true, features = ["std"] }
nixie-sat = { workspace = true, optional = true, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
sat-integration = ["nixie-sat"]
serde = ["dep:serde", "smallvec/serde"]
profiling = ["nixie-core/profiling"]
arena = ["dep:bumpalo"]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "proof_benchmarks"
harness = false

[lints.clippy]
unwrap_used = "deny"
