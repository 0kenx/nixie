[package]
name = "nixie-sat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance CDCL SAT Solver for Nixie"
keywords = ["sat", "cdcl", "solver"]
categories = ["algorithms"]

[features]
default = ["std"]
std = [
    "nixie-time/std","rayon", "tracing", "rustc-hash/std", "nixie-core/std"]
profiling = ["std", "nixie-core/profiling"]
# Enable verbose debug output in conflict analysis
analyze-debug = []

[dependencies]
nixie-core = { workspace = true, default-features = false }
# The single place this crate reads a clock (wasm-safe; see nixie-time).
nixie-time = { workspace = true }
tracing = { workspace = true, default-features = false, optional = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }
hashbrown.workspace = true
portable-atomic-util = { workspace = true }
libm.workspace = true

[dev-dependencies]
nixie-testcorpus = { path = "../nixie-testcorpus" }
proptest = { workspace = true }
serde_json = { workspace = true }
nixie-proof = { path = "../nixie-proof" }

# Profile-Guided Optimization (PGO) Configuration
#
# To use PGO for maximum performance:
#
# 1. Build with instrumentation:
#    RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
#
# 2. Run representative workload to generate profile data:
#    ./target/release/nixie-sat <your-benchmark-files>
#
# 3. Merge profile data:
#    llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
#
# 4. Build with PGO:
#    RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata -Cllvm-args=-pgo-warn-missing-function" cargo build --release
#
# For SIMD optimizations, use:
#    RUSTFLAGS="-C target-cpu=native" cargo build --release

[lints.clippy]
unwrap_used = "deny"
