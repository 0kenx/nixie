[package]
name = "nixie-sat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance CDCL SAT Solver for Nixie"
keywords = ["sat", "cdcl", "solver"]
categories = ["algorithms"]
autotests = false

[features]
default = ["std"]
std = [
    "nixie-time/std","rayon", "tracing", "rustc-hash/std", "nixie-core/std"]
profiling = ["std", "nixie-core/profiling"]
# Enable verbose debug output in conflict analysis
analyze-debug = []
# Compile in the BCP anatomy counters (`NIXIE_BCP_STATS=1` at runtime to
# print; see `nixie_sat::diag_bcp` and
# docs/studies/2026-09-07-throughput-campaign.md). Feature-gated because the
# disabled-but-present per-event branches measured +0.6-1.9% whole-run
# instructions on the anchors (2026-09-07) -- the same shape as `profiling`.
bcp-stats = []
# Per-solver work ledger in the production BCP kernel. No runtime gate or
# global counters; feature-off builds contain none of this instrumentation.
bcp-work = []
# Read-only, sampled shared-blocker feasibility observations. Entirely absent
# from ordinary builds; enable explicitly through Solver or the cnf_solve
# example (NIXIE_WATCH_GROUPS=N).
bcp-groups = ["std"]
# Read-only sampled traffic through certified AND/XOR clause groups.
bcp-regions = ["std"]
# Per-clause cost/use census; no counters or branches in ordinary builds.
clause-traffic = ["std"]

[dependencies]
nixie-core = { workspace = true, default-features = false }
# The single place this crate reads a clock (wasm-safe; see nixie-time).
nixie-time = { workspace = true }
tracing = { workspace = true, default-features = false, optional = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }
hashbrown.workspace = true
portable-atomic-util = { workspace = true }
libm.workspace = true

[dev-dependencies]
nixie-testcorpus = { path = "../nixie-testcorpus" }
proptest = { workspace = true }
serde_json = { workspace = true }
nixie-proof = { path = "../nixie-proof" }

# Profile-Guided Optimization (PGO) Configuration
#
# To use PGO for maximum performance:
#
# 1. Build with instrumentation:
#    RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
#
# 2. Run representative workload to generate profile data:
#    ./target/release/nixie-sat <your-benchmark-files>
#
# 3. Merge profile data:
#    llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
#
# 4. Build with PGO:
#    RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata -Cllvm-args=-pgo-warn-missing-function" cargo build --release
#
# For SIMD optimizations, use:
#    RUSTFLAGS="-C target-cpu=native" cargo build --release

[lints.clippy]
unwrap_used = "deny"

# Integration tests: one binary (see tests/main.rs), plus files
# that install a global allocator or mutate the process environment,
# which keep a process of their own under `cargo test`.
[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "external_branching"
path = "tests/external_branching.rs"

[[test]]
name = "fold_class_unit_regression"
path = "tests/fold_class_unit_regression.rs"

[[test]]
name = "gate_subsume_soundness"
path = "tests/gate_subsume_soundness.rs"

[[test]]
name = "mid_bva_soundness"
path = "tests/mid_bva_soundness.rs"

[[test]]
name = "probe_wide_soundness"
path = "tests/probe_wide_soundness.rs"

[[test]]
name = "reduce_arm_soundness_adapt"
path = "tests/reduce_arm_soundness_adapt.rs"

[[test]]
name = "reduce_arm_soundness_by_used"
path = "tests/reduce_arm_soundness_by_used.rs"

[[test]]
name = "reduce_arm_soundness_glue"
path = "tests/reduce_arm_soundness_glue.rs"

[[test]]
name = "reduce_arm_soundness_null"
path = "tests/reduce_arm_soundness_null.rs"

[[test]]
name = "subsume2_soundness"
path = "tests/subsume2_soundness.rs"
