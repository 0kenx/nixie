[package]
name = "nixie-tla"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "TLA+ intermediate representation: the KerA kernel language and lowering from surface syntax"
keywords = ["tla", "verification", "smt", "model-checking", "ir"]
categories = ["science", "compilers"]
autotests = false

[dependencies]
nixie-tla-syntax = { workspace = true }
thiserror = { workspace = true, default-features = true }
smallvec = { workspace = true }

[lints.clippy]
unwrap_used = "deny"

# Integration tests: one binary (see tests/main.rs), plus files
# that install a global allocator or mutate the process environment,
# which keep a process of their own under `cargo test`.
[[test]]
name = "integration"
path = "tests/main.rs"
