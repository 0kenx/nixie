[package]
name = "oxiz-math"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Mathematical foundations for OxiZ SMT solver"
keywords = ["smt", "math", "simplex", "polynomial", "algebra"]
categories = ["algorithms", "mathematics"]

[dependencies]
# The single place this crate reads a clock (wasm-safe; see oxiz-time).
oxiz-time = { workspace = true }
num-rational = { workspace = true, default-features = false, features = ["num-bigint"] }
num-bigint = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-integer = { workspace = true, default-features = false }
smallvec.workspace = true
rustc-hash.workspace = true
thiserror = { workspace = true, default-features = false }
rand = { workspace = true, optional = true }
hashbrown.workspace = true

[features]
default = ["std"]
std = [
    "oxiz-time/std",
    "num-rational/std",
    "num-bigint/std",
    "num-traits/std",
    "num-integer/std",
    "thiserror/std",
    "rustc-hash/std",
    "rand",
]
# Reserved: the `simd` module is compiled unconditionally and relies on
# auto-vectorization, so this feature currently enables no extra code. It is
# kept so that an explicit opt-in can be added without a breaking change.
simd = []

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "math_benchmarks"
harness = false

[lints.clippy]
unwrap_used = "deny"
