[package]
name = "oxiz-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for OxiZ SMT Solver"
keywords = ["smt", "solver", "python", "pyo3", "bindings"]
categories = ["algorithms", "science", "api-bindings"]
# Distributed via PyPI through maturin (see pyproject.toml / scripts/build_python.sh),
# not crates.io. Keep out of any workspace-wide `cargo publish` sweep.
publish = false

[lints]
workspace = true

[lib]
name = "oxiz"
crate-type = ["cdylib"]
doc = false

# NOTE: `pyo3/extension-module` is intentionally NOT enabled here.
#
# With `extension-module` on, pyo3 leaves all CPython C-API symbols
# (`_Py*`) undefined in the built artifact -- they are resolved at load
# time by the Python interpreter that dlopen()s the compiled `.so`/`.pyd`.
# That is exactly what a real Python wheel needs (see
# `pyproject.toml`'s `[tool.maturin] features = ["pyo3/extension-module"]`,
# which `maturin build`/`maturin develop` pass to a *separate* `cargo
# build` invocation), but it is wrong for `cargo build`/`cargo test`/
# `cargo nextest run` run directly (with or without `--all-features`):
# those compile the crate's `--lib` test target as a plain executable, not
# a cdylib, so it is never dlopen()'d by a Python process and the
# `_Py*` symbols are simply never provided -- the test binary would abort
# at process start with `symbol not found in flat namespace '_PyBool_Type'`
# (observed on aarch64-apple-darwin; see git history of this file /
# .cargo/config.toml for the regression this avoids).
#
# Without `extension-module`, pyo3 links normally (embeds) against the
# actual `libpython3.x` found on the build machine via
# `pyo3-build-config`, so `cargo test -p oxiz-py` / `cargo nextest run -p
# oxiz-py --all-features` produce a binary that resolves those symbols
# for real and can actually run. Do not add `extension-module` back to
# this dependency line -- add/adjust it in `pyproject.toml`'s
# `[tool.maturin]` section instead, which is the only place it should be
# requested.
[dependencies]
oxiz = { workspace = true, features = ["full"] }
pyo3 = { workspace = true }
num-bigint = { workspace = true, features = ["std"] }
num-rational = { workspace = true, features = ["std"] }
num-traits = { workspace = true }
